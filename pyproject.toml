[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "abalo-iching"
version = "0.1.0"
description = "Deterministic Meihua Yishu chart engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lunar_python==1.4.8",
  "openai>=2.45,<3",
  "pydantic>=2.10,<3",
  "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"abalo_iching.data.meihua" = ["*.json"]
"abalo_iching.interpretation.prompts" = ["*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

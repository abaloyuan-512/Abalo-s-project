services:
  - type: web
    name: abalo-owner-preview-engine
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: python scripts/run_hosted_api.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ABALO_ENGINE_KEY
        sync: false
      - key: ABALO_OWNER_PREVIEW_ENABLED
        value: "true"
      - key: ABALO_OWNER_PREVIEW_MAX_PREFLIGHT_USD
        value: "0.50"
